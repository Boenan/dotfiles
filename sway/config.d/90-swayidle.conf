# Idle and lock configuration
#
# This file overrides the Fedora default (/usr/share/sway/config.d/90-swayidle.conf).
# It is the same as the default, with one addition: after-resume turns on the
# laptop screen (eDP-1) again if the lid is open. Sway can miss the lid:off
# event during sleep, and then eDP-1 stays disabled after wake.
#
# Requires: swayidle
# Requires: swaylock
# Requires: /usr/bin/pkill, /usr/bin/pgrep

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT 'swaylock -f' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"'  \
        before-sleep 'swaylock -f' \
        after-resume 'grep -q open /proc/acpi/button/lid/LID/state && swaymsg output eDP-1 enable' \
        lock 'swaylock -f' \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
