# Status Bar: waybar
#
# This file overrides the Fedora default (/usr/share/sway/config.d/90-bar.conf).
# The configuration and the theme are in ~/.config/waybar.
#
# Read `man 5 sway-bar` and `man 5 waybar` for more information about this section.

bar {
    id bar-0
    position top

    # Don't reveal the bar when $mod is pressed in hide mode;
    # $mod+Shift+W toggle should be the only way to show/hide it.
    modifier none

    swaybar_command waybar
}

# Keep the network popup ready, so that it opens at once from the bar
exec $HOME/.config/waybar/network_popup.py
