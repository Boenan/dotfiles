# Status Bar: sway's built-in swaybar
#
# This file overrides the Fedora default (/usr/share/sway/config.d/90-bar.conf)
# which launches waybar. Here we use sway's native bar with a custom
# status_command, themed to match the Everforest Dark Hard waybar config.
#
# Read `man 5 sway-bar` for more information about this section.

bar {
    id bar-0
    position top
    font pango:Hack Nerd Font 11

    # Don't reveal the bar when $mod is pressed in hide mode;
    # $mod+Shift+W toggle should be the only way to show/hide it.
    modifier none

    status_command $HOME/.config/sway/scripts/statusbar.sh
    status_padding 3
    status_edge_padding 4

    # System tray (appears at the far right; swaybar can't interleave it)
    tray_output primary
    icon_theme Papirus

    # -------------------------------------------------------------------------
    # Everforest Dark Hard palette
    #   bg #1e2326  fg #d3c6aa  bg-hover #2e383c  grey #859289
    #   green #a7c080  orange #e69875  red #e67e80
    # colors: <border> <background> <text>
    # -------------------------------------------------------------------------
    colors {
        background         #1e2326
        statusline         #d3c6aa
        focused_statusline #d3c6aa
        focused_background  #1e2326
        separator          #1e2326

        focused_workspace   #a7c080 #a7c080 #1e2326
        active_workspace    #2e383c #2e383c #d3c6aa
        inactive_workspace  #1e2326 #1e2326 #859289
        urgent_workspace    #e67e80 #e67e80 #1e2326
        binding_mode        #e69875 #e69875 #1e2326
    }
}
